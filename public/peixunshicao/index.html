<script>
const goals=['全部方法','让学员熟起来','让班级运转起来','学懂并记住','把知识用起来','总结与规划','评估培训效果'];
const methods=[
['破冰','🧊',[1],'用游戏或小组展示，让初次见面的学员认识彼此。','两人结对互访，再向小组介绍对方。给一个具体话题，比如“最近解决过的一件工作难题”。'],
['班级建设','🏡',[2],'选出班委，让学员共同承担班级事务。','每组每人承担一个角色，按分工完成学习期间的职责。'],
['开班仪式','🚩',[2],'让学员亮相，了解项目安排和主办方的期待。'],
['课程','📚',[3],'围绕培训目标，由老师讲解知识、回应疑问。','备课时先写出学员课后应能完成的动作，再选一个真实案例讲解。'],
['内部交流','💬',[4],'向上级、同事或前辈请教，寻找适合本单位的做法。','请学员带着一个卡住的工作场景来，请分享者讲清当时的判断、动作和结果。'],
['考试','✏️',[3],'用测试带动复习，找出还没掌握的知识。','围绕核心知识出题，答完后让学员解释选择的理由，再针对易错点讲评。'],
['自学','📖',[3],'课前完成在线课程并达标，课中围绕考点自学，课后结合资料继续学习。'],
['实践/演练','🎭',[4],'在模拟或真实任务中尝试做法，再复盘经验。'],
['班级活动','🎤',[1,2],'由班委组织表演、演讲、辩论或综艺互动，让学员在活动中加深了解。'],
['山野探索','⛺',[1],'让学员在山野探索中共同经历一次完整的团队活动，再回顾彼此是怎样协作的。'],
['任务卡','🎯',[2,4],'用一系列具体任务，引导学员主动参与培训。'],
['参观交流','🔎',[4],'走进外部单位，观察先进做法，学习他人经验。','<div class="study-plan"><h4>参观前：列出目标清单</h4><p>提前明确本次参观想了解什么，整理成清单，让每位学员带着目标前往。</p><h4>参观时：安排小组记录</h4><p>建议安排一个小组负责记录参观内容，整理成一份参观笔记。</p></div>'],
['闭营仪式','🎓',[5],'回顾培训历程，交流学习收获。'],
['学习心得','📝',[3,5],'通过书写梳理收获，消化所学知识。','<div class="study-plan"><h4>收集时间</h4><p>一般在培训结束后一周内收齐学习心得。</p><h4>写作思路</h4><ol><li>这次培训，我最有收获的地方是什么？</li><li>针对这件事，我之前是怎么做的？</li><li>回到工作岗位后，我准备怎么做？</li></ol></div>'],
['主题汇报','📊',[4,5],'围绕一个主题整理材料，向大家汇报学习成果。','<ol class="activity-list"><li><strong>提前收齐 PPT</strong><p>汇报前，收齐各组的演示文稿。</p></li><li><strong>汇报开始前 10 分钟抽签</strong><p>请各组组长上台抽签，确定出场顺序。可用扑克牌，也可用写好序号的纸条。</p></li><li><strong>安排专人控时</strong><p>以每组汇报 10 分钟为例：到第 9 分钟提醒一次；到第 10 分钟，控时人直接打断，结束本组汇报。</p></li></ol>'],
['完成IDP','🧭',[5],'把学习收获转化为个人发展计划（IDP）。','选一项待提升的能力，写下一个可实践的工作任务，并约定复盘日期。'],
['小红花','🌺',[2],'根据回答问题、提问交流等课堂表现，为小组积分。','开课前公布积分规则，把提出好问题、帮助同伴和分享实践经验都列为可得分的行为。'],
['课程评估表','📝',[6],'评估课程内容和讲师表现。'],
